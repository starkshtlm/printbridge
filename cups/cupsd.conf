# printbridge CUPS — reachable only from the compose network; no browsing, no shared printers,
# no public admin. The container publishes no port, so "0.0.0.0" here is the container namespace.
LogLevel warn
MaxLogSize 10m
Listen 0.0.0.0:631
Listen /run/cups/cups.sock

# CUPS 2.x validates the HTTP Host: header against its own names and rejects anything else with
# "add '/version=1.1' to server name" — a misleading message that costs an hour to diagnose. The
# app container reaches CUPS as `cups:631`, the compose service name, which the operator may
# rename, so accept any Host. This is safe *here* and only here: this container publishes no port,
# lives on a private compose network, and still enforces access with `Allow @LOCAL` below.
ServerAlias *
Browsing Off
BrowseLocalProtocols none
DefaultAuthType Basic
WebInterface No

# A job to a sleeping printer is held and retried for two hours, then fails loudly (spec §19).
ErrorPolicy retry-job
JobRetryInterval 30
JobRetryLimit 240
PreserveJobHistory Yes
PreserveJobFiles No

<Location />
  Order allow,deny
  Allow @LOCAL
</Location>

<Location /admin>
  Order allow,deny
  Allow localhost
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Order deny,allow
  </Limit>

  <Limit Cancel-Job Cancel-Jobs CUPS-Authenticate-Job>
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
