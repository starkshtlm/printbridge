# cups-pdf for printbridge's mock queue: every job becomes a PDF in /out, which the compose file
# bind-mounts to ./data/mock-out on the host. This is what "MOCK printer" means in MOCKS.md —
# the whole path is exercised, only the paper is missing.
Out /out
AnonDirName /out
AnonUser nobody
Spool /var/spool/cups-pdf/SPOOL
Label 0
UserUMask 0022
Truncate 64
